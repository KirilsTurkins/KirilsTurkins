<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Kirils Turkins developer profile banner</title>
  <desc id="desc">Software developer and Business Informatics student building agentic systems, full-stack platforms, and interactive worlds.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06080d"/>
      <stop offset="0.48" stop-color="#0b111b"/>
      <stop offset="1" stop-color="#111522"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#56d9ff"/>
      <stop offset="0.45" stop-color="#a66bff"/>
      <stop offset="1" stop-color="#ffd65a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121a28" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0a0f18" stop-opacity="0.96"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#36cfff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#36cfff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9a5cff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#9a5cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#7c8aa3" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <clipPath id="clip"><rect x="0" y="0" width="1200" height="390" rx="24"/></clipPath>
    <style>
      .sans{font-family:Inter,"Segoe UI",Arial,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .flow{stroke-dasharray:7 10;animation:dash 13s linear infinite}
      .pulse{animation:pulse 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .pulse2{animation:pulse 2.8s ease-in-out 0.9s infinite;transform-box:fill-box;transform-origin:center}
      .blink{animation:blink 1.1s steps(1,end) infinite}
      .scan{animation:scan 8s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-136}}
      @keyframes pulse{0%,100%{opacity:.55;transform:scale(.88)}50%{opacity:1;transform:scale(1.08)}}
      @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:.15}}
      @keyframes scan{0%{transform:translateY(-18px)}100%{transform:translateY(430px)}}
      @media (prefers-reduced-motion:reduce){.flow,.pulse,.pulse2,.blink,.scan{animation:none}}
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="390" fill="url(#bg)"/>
    <rect width="1200" height="390" fill="url(#grid)"/>
    <ellipse cx="915" cy="95" rx="340" ry="260" fill="url(#glowPurple)"/>
    <ellipse cx="355" cy="415" rx="420" ry="260" fill="url(#glowBlue)"/>
    <rect class="scan" x="0" y="-18" width="1200" height="18" fill="url(#accent)" opacity="0.035"/>

    <path d="M0 74H425l22 22h190" fill="none" stroke="#56d9ff" stroke-opacity="0.24"/>
    <path d="M1200 318H880l-21-21H702" fill="none" stroke="#ffd65a" stroke-opacity="0.20"/>
    <rect x="0" y="0" width="8" height="390" fill="url(#accent)"/>

    <g opacity="0.18" class="sans" font-size="150" font-weight="800" letter-spacing="-10">
      <text x="912" y="160" text-anchor="middle" fill="none" stroke="#c3ccdc" stroke-width="1.4">KT</text>
    </g>

    <g transform="translate(66 53)">
      <g class="mono" font-size="13" letter-spacing="1.6">
        <rect x="0" y="0" width="246" height="30" rx="15" fill="#0f1724" stroke="#4c5b72" stroke-opacity="0.8"/>
        <circle cx="17" cy="15" r="4" fill="#60dcff" class="pulse"/>
        <text x="31" y="20" fill="#aebbd0">PROFILE://KIRILS_TURKINS</text>
      </g>

      <text x="0" y="112" class="sans" font-size="63" font-weight="760" letter-spacing="1" fill="#f4f7fb">KIRILS TURKINS</text>
      <rect x="0" y="129" width="495" height="4" rx="2" fill="url(#accent)"/>
      <text x="0" y="169" class="sans" font-size="20" font-weight="650" letter-spacing="2.1" fill="#c6cfdd">SOFTWARE DEVELOPER · BUSINESS INFORMATICS</text>
      <text x="0" y="206" class="mono" font-size="17" fill="#93a4bb">agentic systems / full-stack platforms / interactive worlds</text>

      <g transform="translate(0 251)" class="mono" font-size="12" font-weight="650" letter-spacing="1.2">
        <g>
          <rect width="126" height="38" rx="9" fill="#101a25" stroke="#56d9ff" stroke-opacity="0.52"/>
          <circle cx="18" cy="19" r="4" fill="#56d9ff"/>
          <text x="31" y="24" fill="#c8f5ff">ARCHITECT</text>
        </g>
        <g transform="translate(140 0)">
          <rect width="112" height="38" rx="9" fill="#161426" stroke="#a66bff" stroke-opacity="0.56"/>
          <circle cx="18" cy="19" r="4" fill="#a66bff"/>
          <text x="31" y="24" fill="#eadcff">BUILD</text>
        </g>
        <g transform="translate(266 0)">
          <rect width="116" height="38" rx="9" fill="#1a1810" stroke="#ffd65a" stroke-opacity="0.58"/>
          <circle cx="18" cy="19" r="4" fill="#ffd65a"/>
          <text x="31" y="24" fill="#fff0b8">VERIFY</text>
        </g>
        <g transform="translate(396 0)">
          <rect width="98" height="38" rx="9" fill="#101923" stroke="#7ed7b5" stroke-opacity="0.55"/>
          <circle cx="18" cy="19" r="4" fill="#7ed7b5"/>
          <text x="31" y="24" fill="#ccf7e8">SHIP</text>
        </g>
      </g>
    </g>

    <g transform="translate(802 77)">
      <rect width="324" height="238" rx="20" fill="url(#panel)" stroke="#6e7f98" stroke-opacity="0.48"/>
      <rect x="19" y="18" width="286" height="27" rx="8" fill="#0a0f17" stroke="#4b5c73" stroke-opacity="0.55"/>
      <circle cx="37" cy="31.5" r="4" fill="#ff6b6b" opacity="0.75"/>
      <circle cx="52" cy="31.5" r="4" fill="#ffd65a" opacity="0.82"/>
      <circle cx="67" cy="31.5" r="4" fill="#6ed7b1" opacity="0.82"/>
      <text x="91" y="36" class="mono" font-size="11" fill="#7788a0">system-map.svg</text>

      <g class="mono" font-size="10.5" font-weight="700" letter-spacing="1">
        <path class="flow" d="M77 91H156" fill="none" stroke="#56d9ff" stroke-width="2" stroke-opacity="0.72"/>
        <path class="flow" d="M205 91H275" fill="none" stroke="#a66bff" stroke-width="2" stroke-opacity="0.72"/>
        <path class="flow" d="M181 119V168" fill="none" stroke="#ffd65a" stroke-width="2" stroke-opacity="0.70"/>
        <path class="flow" d="M158 183H82" fill="none" stroke="#7ed7b5" stroke-width="2" stroke-opacity="0.65"/>
        <path class="flow" d="M205 183H275" fill="none" stroke="#7ed7b5" stroke-width="2" stroke-opacity="0.65"/>

        <g transform="translate(28 72)">
          <rect width="76" height="38" rx="10" fill="#0d1b25" stroke="#56d9ff" stroke-opacity="0.72"/>
          <text x="38" y="24" text-anchor="middle" fill="#c9f6ff">INTENT</text>
        </g>
        <g transform="translate(143 63)">
          <path d="M38 0 76 28 38 56 0 28Z" fill="#18152a" stroke="#a66bff" stroke-opacity="0.86"/>
          <text x="38" y="32" text-anchor="middle" fill="#eadcff">SYSTEM</text>
        </g>
        <g transform="translate(244 72)">
          <rect width="58" height="38" rx="10" fill="#1e1810" stroke="#ffd65a" stroke-opacity="0.75"/>
          <text x="29" y="24" text-anchor="middle" fill="#fff0b8">SHIP</text>
        </g>
        <g transform="translate(142 164)">
          <rect width="78" height="38" rx="10" fill="#0e1b18" stroke="#7ed7b5" stroke-opacity="0.72"/>
          <text x="39" y="24" text-anchor="middle" fill="#d3f8ea">VERIFY</text>
        </g>
        <g transform="translate(28 164)">
          <rect width="76" height="38" rx="10" fill="#111723" stroke="#667a98" stroke-opacity="0.68"/>
          <text x="38" y="24" text-anchor="middle" fill="#c1ccdc">AGENTS</text>
        </g>
        <g transform="translate(244 164)">
          <rect width="58" height="38" rx="10" fill="#111723" stroke="#667a98" stroke-opacity="0.68"/>
          <text x="29" y="24" text-anchor="middle" fill="#c1ccdc">OPS</text>
        </g>
      </g>
      <circle cx="181" cy="91" r="4.5" fill="#a66bff" filter="url(#softGlow)" class="pulse2"/>
      <text x="19" y="224" class="mono" font-size="10" fill="#687990">context → architecture → code → evidence → release</text>
    </g>

    <g opacity="0.34">
      <circle cx="1158" cy="52" r="3" fill="#ffd65a" class="pulse"/>
      <circle cx="756" cy="42" r="3" fill="#56d9ff" class="pulse2"/>
      <circle cx="574" cy="346" r="3" fill="#a66bff" class="pulse"/>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="388.5" rx="23.25" fill="none" stroke="#8390a5" stroke-opacity="0.35" stroke-width="1.5"/>
</svg>
